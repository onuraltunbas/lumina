<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8"/>
  <title>Lumina | Kayıt Ol & Giriş Yap</title>
  <meta content="Lumina Studio - Öğrenme stillerini keşfet, testlerini kaydet ve sana özel gelişim paneline eriş." name="description"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <link href="/static/css/main.css" rel="stylesheet" type="text/css"/>
  <link href="/static/images/64427d8f1fc82a6fb0791e81_favicon.png" rel="shortcut icon" type="image/x-icon"/>
  <link href="/static/images/64427d923fb922a5adafc5ba_webclip.png" rel="apple-touch-icon"/>
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('lumina_theme');
        var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (!stored && prefersDark)) {
          document.documentElement.classList.add('dark-theme');
        } else {
          document.documentElement.classList.remove('dark-theme');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* Auth Ekranına Özel Çizgi Roman / Comic Tasarım */
    .auth-page-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      background: radial-gradient(circle at 15% 20%, #FFFDF0 0%, #F5EEFD 60%, #E9DAFE 100%);
      position: relative;
      overflow-x: hidden;
    }
    .auth-container {
      max-width: 540px;
      margin: 125px auto 60px auto;
      padding: 0 20px;
      width: 100%;
      box-sizing: border-box;
      position: relative;
      z-index: 10;
    }
    @media screen and (max-width: 767px) {
      .auth-container {
        margin-top: 95px;
        margin-bottom: 35px;
        padding: 0 14px;
      }
      .auth-card {
        padding: 28px 18px;
        border-width: 2.5px;
        box-shadow: 5px 5px 0px #1D1D1D;
        border-radius: 16px;
      }
      .auth-header-doodle {
        top: -22px;
        right: 14px;
        font-size: 13px;
        padding: 4px 12px;
        box-shadow: 3px 3px 0px #1D1D1D;
      }
      .auth-tabs {
        gap: 8px;
        margin-bottom: 22px;
        padding-bottom: 12px;
      }
      .auth-tab-btn {
        font-size: 15px;
        padding: 10px 8px;
      }
      .auth-input {
        padding: 12px 14px;
        font-size: 15px;
      }
    }
    @media screen and (max-width: 479px) {
      .auth-container {
        margin-top: 85px;
        padding: 0 12px;
      }
      .auth-header-doodle {
        top: -18px;
        right: 10px;
        font-size: 12px;
        padding: 3px 10px;
      }
      .auth-tab-btn {
        font-size: 14px;
      }
    }
    .auth-card {
      background: #FFFFFF;
      border: 3px solid #1D1D1D;
      box-shadow: 8px 8px 0px #1D1D1D;
      border-radius: 20px;
      padding: 40px 36px;
      position: relative;
    }
    .auth-header-doodle {
      position: absolute;
      top: -28px;
      right: 25px;
      background: #FFE600;
      border: 2.5px solid #1D1D1D;
      box-shadow: 4px 4px 0px #1D1D1D;
      border-radius: 999px;
      padding: 6px 18px;
      font-family: 'Love Ya Like A Sister', cursive, sans-serif;
      font-size: 15px;
      color: #1D1D1D;
      display: flex;
      align-items: center;
      gap: 6px;
      transform: rotate(3deg);
    }
    .auth-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 28px;
      border-bottom: 2.5px solid #1D1D1D;
      padding-bottom: 16px;
    }
    .auth-tab-btn {
      flex: 1;
      padding: 12px 14px;
      border: 2.5px solid #1D1D1D;
      border-radius: 12px;
      font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      background: #F8F9FA;
      color: #555;
      box-shadow: 3px 3px 0px #1D1D1D;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .auth-tab-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #1D1D1D;
      color: #1D1D1D;
    }
    .auth-tab-btn.active {
      background: #FFE600;
      color: #1D1D1D;
      transform: translate(-2px, -2px);
      box-shadow: 5px 5px 0px #1D1D1D;
      border-color: #1D1D1D;
    }
    .auth-form-group {
      margin-bottom: 20px;
      text-align: left;
    }
    .auth-label {
      display: block;
      margin-bottom: 8px;
      font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: #1D1D1D;
      letter-spacing: 0.3px;
    }
    .auth-input {
      width: 100%;
      box-sizing: border-box;
      padding: 14px 16px;
      border: 2.5px solid #1D1D1D;
      border-radius: 12px;
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      background: #FFFFFF;
      box-shadow: 3px 3px 0px rgba(29, 29, 29, 0.15);
      transition: all 0.18s ease;
    }
    .auth-input:focus {
      outline: none;
      box-shadow: 4px 4px 0px #1D1D1D;
      border-color: #1D1D1D;
      background: #FFFDF5;
    }
    .auth-input::placeholder {
      color: #9CA3AF;
      font-size: 15px;
    }
    .auth-checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 18px 0 24px 0;
      cursor: pointer;
      user-select: none;
    }
    .auth-checkbox {
      width: 22px;
      height: 22px;
      border: 2.5px solid #1D1D1D;
      border-radius: 6px;
      cursor: pointer;
      accent-color: #1D1D1D;
    }
    .auth-checkbox-label {
      font-size: 15px;
      color: #333;
      font-weight: 500;
    }
    .auth-submit-btn {
      width: 100%;
      cursor: pointer;
      border: none;
      background: transparent;
      padding: 0;
      margin-top: 10px;
    }
    .auth-submit-btn .button-front {
      width: 100%;
      justify-content: center;
      padding-top: 14px;
      padding-bottom: 14px;
    }
    .auth-switch-prompt {
      margin-top: 26px;
      padding-top: 20px;
      border-top: 2px dashed #E2E8F0;
      text-align: center;
      font-size: 15px;
      color: #555;
    }
    .auth-switch-link {
      background: none;
      border: none;
      color: #7934ED;
      font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 800;
      font-size: 16px;
      cursor: pointer;
      text-decoration: underline;
      margin-left: 6px;
      padding: 0;
      display: inline-block;
      transition: color 0.15s ease;
    }
    .auth-switch-link:hover {
      color: #5312C2;
    }
    .auth-alert {
      display: none;
      border: 2.5px solid #1D1D1D;
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      font-size: 14.5px;
      font-weight: 500;
      align-items: center;
      gap: 10px;
      box-shadow: 3px 3px 0px #1D1D1D;
      animation: alertSlide 0.25s ease-out;
    }
    .auth-alert.error {
      background: #FFE4E6;
      color: #9F1239;
    }
    .auth-alert.success {
      background: #DCFCE7;
      color: #14532D;
    }
    @keyframes alertSlide {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .auth-nav-back {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
      color: #1D1D1D;
      text-decoration: none;
      font-family: 'Cabinet Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      font-weight: 700;
      font-size: 15px;
      background: #FFFFFF;
      border: 2px solid #1D1D1D;
      box-shadow: 3px 3px 0px #1D1D1D;
      border-radius: 10px;
      padding: 6px 14px;
      transition: all 0.15s ease;
    }
    .auth-nav-back:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0px #1D1D1D;
      background: #FFE600;
    }
  </style>
</head>
<body class="body">

  <div class="auth-page-wrapper">
    <!-- Navbar / Üst Kısım -->
    <header class="navbar border-bottom">
      <div class="theme-switch-wrapper">
        <button type="button" class="switch-mode" id="theme-switch-btn" role="switch" aria-checked="false" aria-label="Karanlık/Aydınlık Tema Değiştir">
          <div class="switch-track"></div>
          <div class="switch-knob"></div>
          <div class="switch-icon switch-sun">
            <svg class="icon-sun-solid ionicon" viewBox="0 0 512 512">
              <path d="M256 118a22 22 0 01-22-22V48a22 22 0 0144 0v48a22 22 0 01-22 22zM256 486a22 22 0 01-22-22v-48a22 22 0 0144 0v48a22 22 0 01-22 22zM369.14 164.86a22 22 0 01-15.56-37.55l33.94-33.94a22 22 0 0131.11 31.11l-33.94 33.94a21.93 21.93 0 01-15.55 6.44zM108.92 425.08a22 22 0 01-15.55-37.56l33.94-33.94a22 22 0 1131.11 31.11l-33.94 33.94a21.94 21.94 0 01-15.56 6.45zM464 278h-48a22 22 0 010-44h48a22 22 0 010 44zM96 278H48a22 22 0 010-44h48a22 22 0 010 44zM403.08 425.08a21.94 21.94 0 01-15.56-6.45l-33.94-33.94a22 22 0 0131.11-31.11l33.94 33.94a22 22 0 01-15.55 37.56zM142.86 164.86a21.89 21.89 0 01-15.55-6.44l-33.94-33.94a22 22 0 0131.11-31.11l33.94 33.94a22 22 0 01-15.56 37.55zM256 358a102 102 0 11102-102 102.12 102.12 0 01-102 102z"/>
            </svg>
            <svg class="icon-sun-outline ionicon" viewBox="0 0 512 512">
              <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="32" d="M256 48v48M256 416v48M403.08 108.92l-33.94 33.94M142.86 369.14l-33.94 33.94M464 256h-48M96 256H48M403.08 403.08l-33.94-33.94M142.86 142.86l-33.94-33.94"/>
              <circle cx="256" cy="256" r="80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="32"/>
            </svg>
          </div>
          <div class="switch-icon switch-moon">
            <svg class="icon-moon-outline ionicon" viewBox="0 0 512 512">
              <path d="M160 136c0-30.62 4.51-61.61 16-88C99.57 81.27 48 159.32 48 248c0 119.29 96.71 216 216 216 88.68 0 166.73-51.57 200-128-26.39 11.49-57.38 16-88 16-119.29 0-216-96.71-216-216z" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32"/>
            </svg>
            <svg class="icon-moon-solid ionicon" viewBox="0 0 512 512">
              <path d="M264 480A232 232 0 0132 248c0-94 54-178.28 137.61-214.67a16 16 0 0121.06 21.06C181.07 76.43 176 104.66 176 136c0 110.28 89.72 200 200 200 31.34 0 59.57-5.07 81.61-14.67a16 16 0 0121.06 21.06C442.28 426 358 480 264 480z"/>
            </svg>
          </div>
        </button>
      </div>
      <div class="navbar-space"></div>
      <div class="container">
        <div style="display: flex; align-items: center; padding-left: 78px;">
          <a class="w-nav-brand" href="/" aria-label="Ana Sayfa" style="display: inline-flex; align-items: center;">
            <img alt="Lumina" class="logo" loading="lazy" src="/static/images/644290cf40e714e0668a1a45_logo.svg"/>
          </a>
        </div>
      </div>
      <div class="navbar-space"></div>
    </header>

    <!-- Ana Form Bölümü -->
    <main class="auth-container">
      <div>
        <a href="/" class="auth-nav-back">← Ana Sayfaya Dön</a>
      </div>

      <div class="auth-card">
        <div class="auth-header-doodle">
          Lumina Kimlik
        </div>

        <div style="text-align: center; margin-bottom: 24px;">
          <h1 class="display-3" id="auth-title" style="margin-bottom: 8px;">Öğrenme Yolculuğuna Başla</h1>
          <p style="color: #666; font-size: 15px; margin: 0 auto; max-width: 420px;" id="auth-subtitle">
            Kendi hesabını oluşturarak test sonuçlarını kaydet ve sana özel rehbere dilediğin an ulaş.
          </p>
        </div>

        <!-- Bildirim Alanı (Hata / Başarı) -->
        <div class="auth-alert" id="auth-alert-box">
          <span id="auth-alert-icon">⚠️</span>
          <span id="auth-alert-msg"></span>
        </div>

        <!-- Sekme Düğmeleri (Kayıt Ol / Giriş Yap) -->
        <div class="auth-tabs" role="tablist">
          <button type="button" class="auth-tab-btn active" id="tab-btn-register" role="tab" aria-selected="true">
            <span>📝</span> Kayıt Ol
          </button>
          <button type="button" class="auth-tab-btn" id="tab-btn-login" role="tab" aria-selected="false">
            <span>🔑</span> Giriş Yap
          </button>
        </div>

        <!-- 1. FORM: KAYIT OL -->
        <form id="form-register" autocomplete="on">
          <div class="auth-form-group">
            <label class="auth-label" for="reg-username">👤 Kullanıcı Adı</label>
            <input class="auth-input" id="reg-username" name="username" type="text" placeholder="Kullanıcı adınızı belirleyin" required minlength="3" maxlength="30" autocomplete="username"/>
          </div>

          <div class="auth-form-group">
            <label class="auth-label" for="reg-password">🔒 Şifre (En az 8 karakter)</label>
            <input class="auth-input" id="reg-password" name="password" type="password" placeholder="En az 8 karakterli şifreniz" required minlength="8" maxlength="128" autocomplete="new-password"/>
          </div>

          <div class="auth-form-group">
            <label class="auth-label" for="reg-password-confirm">🔒 Şifre Tekrar</label>
            <input class="auth-input" id="reg-password-confirm" name="password_confirm" type="password" placeholder="Şifrenizi tekrar girin" required minlength="4" maxlength="128" autocomplete="new-password"/>
          </div>

          <button type="submit" class="auth-submit-btn button w-inline-block">
            <div class="button-front background-yellow">
              <div class="button-text">
                <div>Hesabımı Oluştur</div>
                <div class="unicon"></div>
              </div>
            </div>
            <div class="button-edge"></div>
          </button>

          <div class="auth-switch-prompt">
            <span>Daha önce kaydoldunuz mu?</span>
            <button type="button" class="auth-switch-link" id="switch-to-login-btn">Giriş Yapın ➜</button>
          </div>
        </form>

        <!-- 2. FORM: GİRİŞ YAP -->
        <form id="form-login" style="display: none;" autocomplete="on">
          <div class="auth-form-group">
            <label class="auth-label" for="login-username">👤 Kullanıcı Adı</label>
            <input class="auth-input" id="login-username" name="username" type="text" placeholder="Kullanıcı adınızı girin" required autocomplete="username"/>
          </div>

          <div class="auth-form-group">
            <label class="auth-label" for="login-password">🔒 Şifre</label>
            <input class="auth-input" id="login-password" name="password" type="password" placeholder="Şifrenizi girin" required autocomplete="current-password"/>
          </div>

          <label class="auth-checkbox-row">
            <input type="checkbox" class="auth-checkbox" id="login-remember-me" name="remember_me" checked/>
            <span class="auth-checkbox-label">Beni Hatırla (30 gün açık tut)</span>
          </label>

          <button type="submit" class="auth-submit-btn button w-inline-block">
            <div class="button-front background-purple" style="color: #FFFFFF;">
              <div class="button-text">
                <div>Giriş Yap</div>
                <div class="unicon"></div>
              </div>
            </div>
            <div class="button-edge"></div>
          </button>

          <div class="auth-switch-prompt">
            <span>Henüz bir hesabınız yok mu?</span>
            <button type="button" class="auth-switch-link" id="switch-to-register-btn">Hemen Kayıt Olun ➜</button>
          </div>
        </form>

      </div>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="wrapper background-purple border-top" style="padding: 25px 0;">
        <div class="container cc-narrow">
          <div style="text-align: center;">
            <p class="margin-bottom-none" style="font-size: 14px; color: #1D1D1D;">© 2026 Lumina. Tüm hakları saklıdır.</p>
            <div style="margin-top: 10px;">
              <a href="javascript:void(0)" class="cookie-prefs-trigger" style="color: inherit; text-decoration: underline; font-size: 13.5px; cursor: pointer;">🍪 Çerez Tercihleri &amp; KVKK Bildirimi</a>
            </div>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <script>
    (function() {
      // DOM Elemanları
      const tabRegister = document.getElementById('tab-btn-register');
      const tabLogin = document.getElementById('tab-btn-login');
      const formRegister = document.getElementById('form-register');
      const formLogin = document.getElementById('form-login');
      const switchToLoginBtn = document.getElementById('switch-to-login-btn');
      const switchToRegisterBtn = document.getElementById('switch-to-register-btn');
      const authTitle = document.getElementById('auth-title');
      const authSubtitle = document.getElementById('auth-subtitle');
      const authAlertBox = document.getElementById('auth-alert-box');
      const authAlertIcon = document.getElementById('auth-alert-icon');
      const authAlertMsg = document.getElementById('auth-alert-msg');

      function showAlert(type, message) {
        authAlertBox.className = 'auth-alert ' + type;
        authAlertIcon.textContent = type === 'error' ? '❌' : '🎉';
        authAlertMsg.textContent = message;
        authAlertBox.style.display = 'flex';
      }

      function hideAlert() {
        authAlertBox.style.display = 'none';
      }

      function setTab(tabName) {
        hideAlert();
        if (tabName === 'login') {
          tabLogin.classList.add('active');
          tabLogin.setAttribute('aria-selected', 'true');
          tabRegister.classList.remove('active');
          tabRegister.setAttribute('aria-selected', 'false');

          formRegister.style.display = 'none';
          formLogin.style.display = 'block';

          authTitle.textContent = 'Tekrar Hoş Geldiniz!';
          authSubtitle.textContent = 'Kullanıcı adı ve şifrenizi girerek öğrenme panelinize giriş yapın.';
          document.getElementById('login-username').focus();
        } else {
          tabRegister.classList.add('active');
          tabRegister.setAttribute('aria-selected', 'true');
          tabLogin.classList.remove('active');
          tabLogin.setAttribute('aria-selected', 'false');

          formLogin.style.display = 'none';
          formRegister.style.display = 'block';

          authTitle.textContent = 'Öğrenme Yolculuğuna Başla';
          authSubtitle.textContent = 'Kendi hesabını oluşturarak test sonuçlarını kaydet ve sana özel rehbere dilediğin an ulaş.';
          document.getElementById('reg-username').focus();
        }
      }

      // URL Query Parametresi Kontrolü (?tab=login)
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('tab') === 'login') {
        setTab('login');
      }

      tabRegister.addEventListener('click', () => setTab('register'));
      tabLogin.addEventListener('click', () => setTab('login'));
      switchToLoginBtn.addEventListener('click', () => setTab('login'));
      switchToRegisterBtn.addEventListener('click', () => setTab('register'));

      // 1. KAYIT OL İŞLEMİ
      formRegister.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlert();

        const username = document.getElementById('reg-username').value.trim();
        const password = document.getElementById('reg-password').value;
        const passwordConfirm = document.getElementById('reg-password-confirm').value;

        if (!username || !password) {
          showAlert('error', 'Lütfen tüm alanları doldurunuz.');
          return;
        }

        if (password.length < 8) {
          showAlert('error', 'Şifreniz güvenlik standartları gereği en az 8 karakter olmalıdır.');
          return;
        }

        if (password !== passwordConfirm) {
          showAlert('error', 'Girdiğiniz şifreler birbiriyle eşleşmiyor. Lütfen kontrol ediniz.');
          return;
        }

        const submitBtn = formRegister.querySelector('button[type="submit"]');
        submitBtn.disabled = true;

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });

          const data = await res.json();
          if (!res.ok) {
            showAlert('error', data.detail || 'Kayıt sırasında bir hata oluştu.');
            submitBtn.disabled = false;
            return;
          }

          showAlert('success', data.message || 'Kayıt başarılı! Yönlendiriliyorsunuz...');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 800);
        } catch (err) {
          showAlert('error', 'Sunucu bağlantı hatası: ' + err.message);
          submitBtn.disabled = false;
        }
      });

      // 2. GİRİŞ YAP İŞLEMİ
      formLogin.addEventListener('submit', async function(e) {
        e.preventDefault();
        hideAlert();

        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;
        const rememberMe = document.getElementById('login-remember-me').checked;

        if (!username || !password) {
          showAlert('error', 'Lütfen kullanıcı adı ve şifrenizi giriniz.');
          return;
        }

        const submitBtn = formLogin.querySelector('button[type="submit"]');
        submitBtn.disabled = true;

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password, remember_me: rememberMe })
          });

          const data = await res.json();
          if (!res.ok) {
            showAlert('error', data.detail || 'Giriş yapılamadı. Bilgilerinizi kontrol edin.');
            submitBtn.disabled = false;
            return;
          }

          showAlert('success', data.message || 'Giriş başarılı! Yönlendiriliyorsunuz...');
          setTimeout(() => {
            window.location.href = '/dashboard';
          }, 700);
        } catch (err) {
          showAlert('error', 'Sunucu bağlantı hatası: ' + err.message);
          submitBtn.disabled = false;
        }
      });
    })();
  </script>
  <script src="/static/js/theme.js"></script>
  <script src="/static/js/cookie-consent.js"></script>
</body>
</html>
