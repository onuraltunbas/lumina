<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumi - İnteraktif Dijital Asistan & Karakter Stüdyosu</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

        :root {
            /* Renk Paleti */
            --bg-night: #060b19;
            --bg-night-light: #121f3d;
            --lumi-cream: #FFF4EA;
            --lumi-ivory: #FFFAF5;
            --lumi-sky: #A9D3FF;
            --lumi-blue-tip: #82B9F5;
            --lumi-navy: #18264A;
            --lumi-iris: #405B9B;
            --lumi-pink: #FFA9BD;
            --lumi-gold: #FFE49A;
            --lumi-mouth: #663C4A;
            --lumi-purple: #7934ED;

            /* Animasyon Ayarları */
            --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
            --smooth: cubic-bezier(0.4, 0, 0.2, 1);
            --trans-speed: 0.5s;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at 50% 30%, var(--bg-night-light) 0%, var(--bg-night) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            font-family: 'Nunito', sans-serif;
            overflow-x: hidden;
            color: white;
            padding: 20px;
        }

        /* Arka Plan Yıldızları */
        .stars-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            background-image:
                radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            opacity: 0.35;
            z-index: 0;
        }

        #app-container {
            position: relative;
            width: 100%;
            max-width: 960px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
            gap: 16px;
        }

        header.title-bar {
            text-align: center;
            margin-bottom: 4px;
        }
        header.title-bar h1 {
            font-size: 1.8rem;
            font-weight: 900;
            background: linear-gradient(135deg, #FFE49A 0%, #A9D3FF 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        header.title-bar p {
            font-size: 0.95rem;
            color: #94A3B8;
        }

        /* Konuşma Balonu */
        .speech-bubble-container {
            width: 90%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 90px;
            position: relative;
        }

        .speech-bubble {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
            border-radius: 20px;
            padding: 14px 22px;
            text-align: center;
            font-size: 1.05rem;
            font-weight: 700;
            color: #FFFAF5;
            transition: all 0.3s ease;
            width: 100%;
        }

        .speech-tail {
            width: 16px;
            height: 16px;
            background: rgba(255, 255, 255, 0.12);
            border-bottom: 1.5px solid rgba(255, 255, 255, 0.25);
            border-right: 1.5px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(16px);
            transform: translateY(-8px) rotate(45deg);
            z-index: -1;
        }

        @keyframes bubbleUpdate {
            0% { transform: scale(0.96); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Lumi Sahnesi */
        #lumi-stage {
            width: 100%;
            max-width: 520px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        svg#lumi {
            width: 100%;
            height: auto;
            max-height: 48vh;
            filter: drop-shadow(0 25px 25px rgba(0,0,0,0.55));
            overflow: visible;
        }

        /* Kesin Vektörel Koordinat Pivot Noktaları (Göz kayması ve deformasyonu önler) */
        #lumi-body { transform-origin: 400px 600px; }
        #lumi-leg-l { transform-origin: 320px 650px; }
        #lumi-leg-r { transform-origin: 480px 650px; }
        #lumi-arm-l { transform-origin: 290px 510px; }
        #lumi-arm-r { transform-origin: 510px 510px; }
        #lumi-head-group { transform-origin: 400px 480px; }
        #lumi-tuft-l { transform-origin: 230px 320px; }
        #lumi-tuft-r { transform-origin: 570px 320px; }
        #lumi-eyes { transform-origin: 400px 360px; }
        .eyes-blink { transform-origin: 400px 360px; }
        #eye-wrap-l { transform-origin: 300px 360px; }
        #eye-wrap-r { transform-origin: 500px 360px; }
        #pupils-l { transform-origin: 300px 360px; }
        #pupils-r { transform-origin: 500px 360px; }
        #lid-l { transform-origin: 300px 360px; }
        #lid-r { transform-origin: 500px 360px; }
        #eye-happy-l { transform-origin: 300px 360px; }
        #eye-happy-r { transform-origin: 500px 360px; }
        #brow-l { transform-origin: 300px 270px; }
        #brow-r { transform-origin: 500px 270px; }
        #cheek-l { transform-origin: 250px 420px; }
        #cheek-r { transform-origin: 550px 420px; }
        .mouth-shape { transform-origin: 400px 428px; }
        #lumi-antenna { transform-origin: 400px 175px; }
        .orb-wrap { transform-origin: 400px 55px; }
        #orb-core { transform-origin: 400px 55px; }
        .emotion-effect { transform-origin: center; transform-box: fill-box; }

        .anim-part {
            transition: transform 0.42s var(--bounce),
                        opacity 0.2s ease,
                        fill 0.35s ease,
                        stroke 0.35s ease;
        }

        .smooth-part {
            transition: all 0.6s ease-in-out;
        }

        /* Temel Animasyonlar */
        @keyframes idleFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes blink {
            0%, 93%, 100% { transform: scaleY(1); }
            96% { transform: scaleY(0.06); }
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); filter: url(#glow-orb); }
            50% { transform: scale(1.14); filter: url(#glow-orb-bright); }
        }

        @keyframes orbNeuralPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.24); }
        }

        @keyframes sleepPulse {
            0%, 100% { transform: scale(0.92); opacity: 0.6; }
            50% { transform: scale(1.02); opacity: 0.9; }
        }

        @keyframes excitedJump {
            0%, 100% { transform: translateY(0) scaleY(1); }
            40% { transform: translateY(-26px) scaleY(1.05); }
            80% { transform: translateY(3px) scaleY(0.96); }
        }

        @keyframes zzzFloat {
            0%, 100% { transform: translateY(0); opacity: 0.5; }
            50% { transform: translateY(-14px); opacity: 1; }
        }

        /* Varsayılan Animasyonlar */
        #lumi-master { animation: idleFloat 3.8s ease-in-out infinite; }
        .eyes-blink { animation: blink 5.5s infinite; }
        #orb-core { animation: orbPulse 3.5s ease-in-out infinite; }

        /* Ortak Gizli Parçalar */
        .mouth-shape {
            opacity: 0;
            transition: opacity 0.12s ease, transform 0.35s var(--bounce);
            pointer-events: none;
        }
        .emotion-effect, .eye-closed, .eye-happy {
            opacity: 0;
            pointer-events: none;
        }
        .brow {
            opacity: 0.22;
            transition: opacity 0.25s ease, transform 0.42s var(--bounce), stroke-width 0.3s ease;
        }
        .lid {
            transform: translateY(-12px);
            transition: transform 0.42s var(--bounce), opacity 0.2s ease;
        }

        /* Pozlanmış mimiklerde göz kırpma animasyonunu durdur (Esneme/bozulmaları önler) */
        [data-state="mutlu"] .eyes-blink,
        [data-state="heyecanli"] .eyes-blink,
        [data-state="dusunuyor"] .eyes-blink,
        [data-state="saskin"] .eyes-blink,
        [data-state="merakli"] .eyes-blink,
        [data-state="mahcup"] .eyes-blink,
        [data-state="teselli"] .eyes-blink,
        [data-state="uzgun"] .eyes-blink,
        [data-state="uyari"] .eyes-blink,
        [data-state="kizgin"] .eyes-blink,
        [data-state="uykulu"] .eyes-blink {
            animation: none;
        }

        /* =========================================================
           12 DUYGU DURUMU (CSS STATE MAKİNESİ)
           ========================================================= */

        /* 1. NORMAL (Varsayılan Dostça) */
        [data-state="normal"] #mouth-smile { opacity: 1; transform: scale(1); }
        [data-state="normal"] #cheek-l, [data-state="normal"] #cheek-r { opacity: 0.8; }
        [data-state="normal"] #lid-l, [data-state="normal"] #lid-r { transform: translateY(-12px); }

        /* 2. DİNLİYOR (Kullanıcı yazarken) */
        [data-state="dinliyor"] #lumi-head-group { transform: rotate(8deg) translateY(-4px); }
        [data-state="dinliyor"] #mouth-smile { opacity: 1; transform: scale(1.06); }
        [data-state="dinliyor"] #pupils-l, [data-state="dinliyor"] #pupils-r { transform: translate(4px, 4px); }
        [data-state="dinliyor"] #brow-r { opacity: 0.75; transform: translateY(-10px); }
        [data-state="dinliyor"] #brow-l { opacity: 0.45; }
        [data-state="dinliyor"] #lid-l { transform: translateY(16px); }
        [data-state="dinliyor"] #lid-r { transform: translateY(-12px); }
        [data-state="dinliyor"] #lumi-arm-l { transform: rotate(-18deg) translateY(-8px); }
        [data-state="dinliyor"] #lumi-arm-r { transform: rotate(10deg); }
        [data-state="dinliyor"] #orb-core { transform: scale(1.12); }

        /* 3. DÜŞÜNÜYOR / AI CEVAP ÜRETİYOR (Nöral Sinaps Halesi) */
        [data-state="dusunuyor"] #lumi-head-group { transform: rotate(10deg) translateY(-8px); }
        [data-state="dusunuyor"] #pupils-l, [data-state="dusunuyor"] #pupils-r { transform: translate(10px, -12px); }
        [data-state="dusunuyor"] #lid-l { transform: translateY(28px) rotate(6deg); }
        [data-state="dusunuyor"] #lid-r { transform: translateY(16px); }
        [data-state="dusunuyor"] #brow-r { opacity: 0.85; transform: translateY(-16px) rotate(12deg); }
        [data-state="dusunuyor"] #brow-l { opacity: 0.65; transform: translateY(4px) rotate(-6deg); }
        [data-state="dusunuyor"] #mouth-o { opacity: 1; transform: scale(0.68); }
        [data-state="dusunuyor"] #lumi-arm-l { transform: rotate(-48deg) translateY(-22px) translateX(14px); }
        [data-state="dusunuyor"] #lumi-arm-r { transform: rotate(16deg) translateX(-8px); }
        [data-state="dusunuyor"] #orb-core { fill: #C084FC; animation: orbNeuralPulse 1.3s ease-in-out infinite; }

        /* 4. TAKTİK / FİKİR ("Aha! Buldum!" - Ampul gibi parlayan küre) */
        [data-state="taktik"] #lumi-head-group { transform: translateY(-8px); }
        [data-state="taktik"] #mouth-smile { opacity: 1; transform: scale(1.18); }
        [data-state="taktik"] #brow-l, [data-state="taktik"] #brow-r { opacity: 0.85; transform: translateY(-16px); }
        [data-state="taktik"] #lid-l, [data-state="taktik"] #lid-r { transform: translateY(-12px); }
        [data-state="taktik"] #lumi-arm-r { transform: rotate(-68deg) translateY(-22px); }
        [data-state="taktik"] #lumi-arm-l { transform: rotate(-18deg) translateX(10px); }
        [data-state="taktik"] #orb-core { fill: #FFFFFF; transform: scale(1.4); animation: none; }
        [data-state="taktik"] #cheek-l, [data-state="taktik"] #cheek-r { opacity: 1; transform: scale(1.15); }
        [data-state="taktik"] #efx-stars { opacity: 1; }

        /* 5. MUTLU (Anime ^^ Gözler) */
        [data-state="mutlu"] #lumi-head-group { transform: translateY(-4px); }
        [data-state="mutlu"] .eye-open-parts { opacity: 0; }
        [data-state="mutlu"] .lid { opacity: 0; }
        [data-state="mutlu"] #eye-happy-l, [data-state="mutlu"] #eye-happy-r { opacity: 1; }
        [data-state="mutlu"] #brow-l, [data-state="mutlu"] #brow-r { opacity: 0.8; transform: translateY(-12px); }
        [data-state="mutlu"] #mouth-happy { opacity: 1; transform: scale(1); }
        [data-state="mutlu"] #lumi-arm-l { transform: rotate(22deg) translateY(-6px); }
        [data-state="mutlu"] #lumi-arm-r { transform: rotate(-22deg) translateY(-6px); }
        [data-state="mutlu"] #cheek-l, [data-state="mutlu"] #cheek-r { opacity: 1; transform: scale(1.25) translateY(-4px); }
        [data-state="mutlu"] #orb-core { animation: orbPulse 2s ease-in-out infinite; fill: #FFE49A; }

        /* 6. HEYECANLI (Zıplama ve Yıldızlar) */
        [data-state="heyecanli"] #lumi-master { animation: excitedJump 0.85s var(--bounce) infinite; }
        [data-state="heyecanli"] .eye-open-parts { opacity: 0; }
        [data-state="heyecanli"] .lid { opacity: 0; }
        [data-state="heyecanli"] #eye-happy-l, [data-state="heyecanli"] #eye-happy-r { opacity: 1; transform: scale(1.08); }
        [data-state="heyecanli"] #mouth-happy { opacity: 1; transform: scale(1.28); }
        [data-state="heyecanli"] #cheek-l, [data-state="heyecanli"] #cheek-r { opacity: 1; transform: scale(1.3); }
        [data-state="heyecanli"] #brow-l, [data-state="heyecanli"] #brow-r { opacity: 0.9; transform: translateY(-18px); }
        [data-state="heyecanli"] #lumi-tuft-l { transform: rotate(-8deg) translateY(-6px); }
        [data-state="heyecanli"] #lumi-tuft-r { transform: rotate(8deg) translateY(-6px); }
        [data-state="heyecanli"] #lumi-arm-l { transform: rotate(60deg) translateY(-26px); }
        [data-state="heyecanli"] #lumi-arm-r { transform: rotate(-60deg) translateY(-26px); }
        [data-state="heyecanli"] #lumi-leg-l { transform: rotate(-15deg) translateY(-4px); }
        [data-state="heyecanli"] #lumi-leg-r { transform: rotate(15deg) translateY(-4px); }
        [data-state="heyecanli"] #orb-core { fill: #FFFFFF; transform: scale(1.35); animation: none; }
        [data-state="heyecanli"] #efx-stars { opacity: 1; }

        /* 7. MERAKLI (Soru İşareti Efx) */
        [data-state="merakli"] #lumi-head-group { transform: rotate(12deg); }
        [data-state="merakli"] #mouth-o { opacity: 1; transform: scale(0.75); }
        [data-state="merakli"] #brow-r { opacity: 0.95; transform: translateY(-20px) rotate(12deg); }
        [data-state="merakli"] #brow-l { opacity: 0.6; transform: translateY(6px) rotate(4deg); }
        [data-state="merakli"] #lid-l { transform: translateY(24px) rotate(6deg); }
        [data-state="merakli"] #lid-r { transform: translateY(-12px); }
        [data-state="merakli"] #pupils-l, [data-state="merakli"] #pupils-r { transform: translate(8px, -8px); }
        [data-state="merakli"] #lumi-arm-l { transform: rotate(-35deg) translateY(-12px); }
        [data-state="merakli"] #lumi-arm-r { transform: rotate(15deg); }
        [data-state="merakli"] #orb-core { animation-duration: 1.6s; }
        [data-state="merakli"] #efx-question { opacity: 1; transform: translateY(-18px); }

        /* 8. ŞAŞKIN ('O' Ağız, Yerinde Büyüyen Gözler) */
        [data-state="saskin"] #lumi-head-group { transform: translateY(-14px); }
        [data-state="saskin"] #eye-wrap-l, [data-state="saskin"] #eye-wrap-r { transform: scale(1.15); }
        [data-state="saskin"] #mouth-o { opacity: 1; transform: scale(1.28); }
        [data-state="saskin"] #brow-l, [data-state="saskin"] #brow-r { opacity: 0.95; transform: translateY(-24px); }
        [data-state="saskin"] #lid-l, [data-state="saskin"] #lid-r { transform: translateY(-15px); }
        [data-state="saskin"] #orb-core { transform: scale(1.35); animation: none; }
        [data-state="saskin"] #lumi-arm-l { transform: rotate(32deg) translateX(-15px); }
        [data-state="saskin"] #lumi-arm-r { transform: rotate(-32deg) translateX(15px); }

        /* 9. MAHCUP (Kızarık Allık, Kaçık Bakış) */
        [data-state="mahcup"] #lumi-head-group { transform: rotate(-8deg) translateY(8px); }
        [data-state="mahcup"] #mouth-smile { opacity: 1; transform: scale(0.75); }
        [data-state="mahcup"] #cheek-l, [data-state="mahcup"] #cheek-r { opacity: 1; transform: scale(1.45); }
        [data-state="mahcup"] #pupils-l, [data-state="mahcup"] #pupils-r { transform: translate(-10px, 8px); }
        [data-state="mahcup"] #lid-l, [data-state="mahcup"] #lid-r { transform: translateY(32px); }
        [data-state="mahcup"] #brow-l { opacity: 0.6; transform: translateY(-2px) rotate(-8deg); }
        [data-state="mahcup"] #brow-r { opacity: 0.6; transform: translateY(-2px) rotate(8deg); }
        [data-state="mahcup"] #lumi-arm-l { transform: rotate(-30deg) translateX(22px); }
        [data-state="mahcup"] #lumi-arm-r { transform: rotate(30deg) translateX(-22px); }
        [data-state="mahcup"] #lumi-leg-l { transform: rotate(10deg); }
        [data-state="mahcup"] #lumi-leg-r { transform: rotate(-10deg); }
        [data-state="mahcup"] #orb-core { fill: #FFA9BD; }

        /* 10. TESELLİ / ÜZGÜN (Empati, Düşük Kulaklar) */
        [data-state="teselli"] #lumi-head-group, [data-state="uzgun"] #lumi-head-group { transform: translateY(12px); }
        [data-state="teselli"] #mouth-sad, [data-state="uzgun"] #mouth-sad { opacity: 1; transform: scale(0.9); }
        [data-state="teselli"] #brow-l, [data-state="uzgun"] #brow-l { opacity: 0.95; transform: translateY(-8px) rotate(-16deg); }
        [data-state="teselli"] #brow-r, [data-state="uzgun"] #brow-r { opacity: 0.95; transform: translateY(-8px) rotate(16deg); }
        [data-state="teselli"] #lid-l, [data-state="uzgun"] #lid-l { transform: translateY(36px) rotate(-12deg); }
        [data-state="teselli"] #lid-r, [data-state="uzgun"] #lid-r { transform: translateY(36px) rotate(12deg); }
        [data-state="teselli"] #pupils-l, [data-state="teselli"] #pupils-r,
        [data-state="uzgun"] #pupils-l, [data-state="uzgun"] #pupils-r { transform: translateY(6px); }
        [data-state="teselli"] #lumi-tuft-l, [data-state="uzgun"] #lumi-tuft-l { transform: rotate(16deg); }
        [data-state="teselli"] #lumi-tuft-r, [data-state="uzgun"] #lumi-tuft-r { transform: rotate(-16deg); }
        [data-state="teselli"] #lumi-arm-l { transform: rotate(18deg) translateY(-8px) translateX(8px); }
        [data-state="teselli"] #lumi-arm-r { transform: rotate(-18deg) translateY(-8px) translateX(-8px); }
        [data-state="teselli"] #orb-core, [data-state="uzgun"] #orb-core { animation: sleepPulse 4s infinite; fill: var(--lumi-gold); }

        /* 11. UYARI / KORUMA (Kızgın/Çatık, Kırmızı Küre) */
        [data-state="uyari"] #lumi-head-group, [data-state="kizgin"] #lumi-head-group { transform: translateY(4px); }
        [data-state="uyari"] #mouth-flat, [data-state="kizgin"] #mouth-flat { opacity: 1; transform: scale(1.15); }
        [data-state="uyari"] #brow-l, [data-state="kizgin"] #brow-l { opacity: 1; transform: translateY(14px) rotate(22deg); stroke-width: 14; }
        [data-state="uyari"] #brow-r, [data-state="kizgin"] #brow-r { opacity: 1; transform: translateY(14px) rotate(-22deg); stroke-width: 14; }
        [data-state="uyari"] #lid-l, [data-state="kizgin"] #lid-l { transform: translateY(44px) rotate(16deg); }
        [data-state="uyari"] #lid-r, [data-state="kizgin"] #lid-r { transform: translateY(44px) rotate(-16deg); }
        [data-state="uyari"] #lumi-arm-l, [data-state="kizgin"] #lumi-arm-l { transform: rotate(-32deg) translateX(22px) translateY(-10px); }
        [data-state="uyari"] #lumi-arm-r, [data-state="kizgin"] #lumi-arm-r { transform: rotate(32deg) translateX(-22px) translateY(-10px); }
        [data-state="uyari"] #orb-core, [data-state="kizgin"] #orb-core { fill: #FFAAA6; filter: url(#glow-orb-red); animation: none; }
        [data-state="uyari"] .cheek, [data-state="kizgin"] .cheek { opacity: 0.15; }

        /* 12. UYKULU (Esneyen, ZzZ Balonları) */
        [data-state="uykulu"] #lumi-master { animation: idleFloat 6.5s ease-in-out infinite; }
        [data-state="uykulu"] #lumi-head-group { transform: translateY(22px) rotate(6deg); }
        [data-state="uykulu"] #lumi-body { transform: scaleY(0.95) translateY(8px); }
        [data-state="uykulu"] #brow-l, [data-state="uykulu"] #brow-r { opacity: 0.45; transform: translateY(8px); }
        [data-state="uykulu"] #lid-l, [data-state="uykulu"] #lid-r { transform: translateY(82px); }
        [data-state="uykulu"] #pupils-l, [data-state="uykulu"] #pupils-r { transform: translateY(12px); }
        [data-state="uykulu"] #mouth-flat { opacity: 1; transform: scale(0.65); }
        [data-state="uykulu"] #lumi-arm-l { transform: translateY(14px) rotate(6deg); }
        [data-state="uykulu"] #lumi-arm-r { transform: translateY(14px) rotate(-6deg); }
        [data-state="uykulu"] #lumi-leg-l, [data-state="uykulu"] #lumi-leg-r { transform: translateY(-4px) scaleY(0.85); }
        [data-state="uykulu"] #orb-core { animation: sleepPulse 5s infinite; fill: #FFE0B2; }
        [data-state="uykulu"] #efx-zzz { opacity: 1; animation: zzzFloat 3s ease-in-out infinite; }

        /* 13. TIRMANIYOR (Duvara Tırmanma) */
        [data-state="tirmaniyor"] #lumi-head-group { transform: rotate(-8deg) translateY(-8px); }
        [data-state="tirmaniyor"] #mouth-smile { opacity: 1; transform: scale(1.05); }
        [data-state="tirmaniyor"] #lid-l, [data-state="tirmaniyor"] #lid-r { transform: translateY(-12px); }
        [data-state="tirmaniyor"] #pupils-l, [data-state="tirmaniyor"] #pupils-r { transform: translate(4px, -10px); }
        [data-state="tirmaniyor"] #lumi-arm-l { animation: climbArmL 0.48s ease-in-out infinite alternate; }
        [data-state="tirmaniyor"] #lumi-arm-r { animation: climbArmR 0.48s ease-in-out infinite alternate; }
        [data-state="tirmaniyor"] #lumi-leg-l { animation: climbLegL 0.48s ease-in-out infinite alternate; }
        [data-state="tirmaniyor"] #lumi-leg-r { animation: climbLegR 0.48s ease-in-out infinite alternate; }

        @keyframes climbArmL {
            0% { transform: rotate(74deg) translateY(-28px) translateX(12px); }
            100% { transform: rotate(22deg) translateY(-6px) translateX(4px); }
        }
        @keyframes climbArmR {
            0% { transform: rotate(22deg) translateY(-6px) translateX(-4px); }
            100% { transform: rotate(74deg) translateY(-28px) translateX(-12px); }
        }
        @keyframes climbLegL {
            0% { transform: rotate(-32deg) translateY(-4px); }
            100% { transform: rotate(20deg) translateY(4px); }
        }
        @keyframes climbLegR {
            0% { transform: rotate(20deg) translateY(4px); }
            100% { transform: rotate(-32deg) translateY(-4px); }
        }

        /* 14. ASILI (Tavanda Asılma & Sallanma) */
        [data-state="asili"] #lumi-head-group { transform: translateY(-6px); }
        [data-state="asili"] .eye-open-parts { opacity: 0; }
        [data-state="asili"] .lid { opacity: 0; }
        [data-state="asili"] #eye-happy-l, [data-state="asili"] #eye-happy-r { opacity: 1; }
        [data-state="asili"] #mouth-happy { opacity: 1; transform: scale(1.15); }
        [data-state="asili"] #lumi-arm-l { transform: rotate(84deg) translateY(-32px); }
        [data-state="asili"] #lumi-arm-r { transform: rotate(-84deg) translateY(-32px); }
        [data-state="asili"] #lumi-leg-l { animation: dangleLegL 0.48s ease-in-out infinite alternate; }
        [data-state="asili"] #lumi-leg-r { animation: dangleLegR 0.48s ease-in-out infinite alternate; }
        [data-state="asili"] #lumi-master { animation: hangSwing 1.45s ease-in-out infinite alternate; transform-origin: 50% 12%; }

        @keyframes dangleLegL {
            0% { transform: rotate(-18deg) translateY(4px); }
            100% { transform: rotate(18deg) translateY(2px); }
        }
        @keyframes dangleLegR {
            0% { transform: rotate(18deg) translateY(2px); }
            100% { transform: rotate(-18deg) translateY(4px); }
        }
        @keyframes hangSwing {
            0% { transform: rotate(-10deg); }
            100% { transform: rotate(10deg); }
        }

        /* 15. HAVADA ASILI (Çizgi Film Düşüşü / Wile E. Coyote) */
        [data-state="hover_drop"] #lumi-master { animation: hoverShiver 0.08s ease-in-out infinite; }
        [data-state="hover_drop"] #pupils-l, [data-state="hover_drop"] #pupils-r { transform: translateY(16px); }
        [data-state="hover_drop"] #lid-l, [data-state="hover_drop"] #lid-r { transform: translateY(-16px); }
        [data-state="hover_drop"] #brow-l, [data-state="hover_drop"] #brow-r { opacity: 1; transform: translateY(-22px) rotate(8deg); }
        [data-state="hover_drop"] #mouth-o { opacity: 1; transform: scale(1.4); }
        [data-state="hover_drop"] #orb-core { transform: scale(1.35); fill: #FFA9BD; animation: none; }
        [data-state="hover_drop"] #lumi-leg-l { animation: hoverPedalL 0.12s linear infinite; }
        [data-state="hover_drop"] #lumi-leg-r { animation: hoverPedalR 0.12s linear infinite; }
        [data-state="hover_drop"] #lumi-arm-l { animation: hoverFlailL 0.14s ease-in-out infinite; }
        [data-state="hover_drop"] #lumi-arm-r { animation: hoverFlailR 0.14s ease-in-out infinite; }

        @keyframes hoverPedalL {
            0% { transform: rotate(-38deg) translateY(-8px); }
            50% { transform: rotate(38deg) translateY(4px); }
            100% { transform: rotate(-38deg) translateY(-8px); }
        }
        @keyframes hoverPedalR {
            0% { transform: rotate(38deg) translateY(4px); }
            50% { transform: rotate(-38deg) translateY(-8px); }
            100% { transform: rotate(38deg) translateY(4px); }
        }
        @keyframes hoverFlailL {
            0% { transform: rotate(68deg) translateY(-28px) translateX(10px); }
            50% { transform: rotate(32deg) translateY(-14px) translateX(4px); }
            100% { transform: rotate(68deg) translateY(-28px) translateX(10px); }
        }
        @keyframes hoverFlailR {
            0% { transform: rotate(-68deg) translateY(-28px) translateX(-10px); }
            50% { transform: rotate(-32deg) translateY(-14px) translateX(-4px); }
            100% { transform: rotate(-68deg) translateY(-28px) translateX(-10px); }
        }
        @keyframes hoverShiver {
            0% { transform: translate(0, 0); }
            25% { transform: translate(-2px, 1px); }
            50% { transform: translate(2px, -1px); }
            75% { transform: translate(-1px, -2px); }
            100% { transform: translate(0, 0); }
        }

        /* Kontrol Paneli */
        #controls-panel {
            width: 100%;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 16px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .btn-emotion {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #d1d5db;
            padding: 10px 8px;
            border-radius: 12px;
            font-size: 0.92rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-emotion:hover {
            background: rgba(255, 255, 255, 0.18);
            color: white;
            transform: translateY(-2px);
        }

        .btn-emotion.active {
            background: linear-gradient(135deg, rgba(169, 211, 255, 0.45) 0%, rgba(130, 185, 245, 0.45) 100%);
            border-color: rgba(169, 211, 255, 0.7);
            color: #fff;
            box-shadow: 0 0 18px rgba(169, 211, 255, 0.35);
            transform: translateY(-2px);
        }

        @media (max-width: 680px) {
            #controls-panel { grid-template-columns: repeat(3, 1fr); }
            svg#lumi { max-height: 42vh; }
        }
        @media (max-width: 460px) {
            #controls-panel { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="stars-bg"></div>

    <div id="app-container">

        <div id="lumi-stage" data-state="normal">
            <svg id="lumi" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <!-- Gövde Gradienti -->

                        <stop offset="100%" stop-color="var(--lumi-blue-tip)"/>

                        <stop offset="35%" stop-color="var(--lumi-cream)"/>
                        <stop offset="70%" stop-color="var(--lumi-sky)"/>

                        <stop offset="70%" stop-color="var(--lumi-cream)"/>

                        <stop offset="100%" stop-color="#0A1124"/>

                    <!-- Yanak Allık Gradienti (Yumuşak) -->

                            <feMergeNode in="blur1"/>

                            <feMergeNode in="SourceGraphic"/>

                    <filter id="glow-orb-purple" x="-150%" y="-150%" width="400%" height="400%">

                        <feGaussianBlur stdDeviation="30" result="blur2"/>
                        <feColorMatrix type="matrix" values="0.8 0 0 0 0  0 0.4 0 0 0  1 0 1 0 0  0 0 0 1 0" in="blur2" result="purpTint"/>
                        <feMerge>
                            <feMergeNode in="purpTint"/>

                        </feMerge>
                    </filter>

                    <filter id="glow-orb-dim" x="-100%" y="-100%" width="300%" height="300%">

                        <feMerge>
                            <feMergeNode in="blur1"/>
                            <feMergeNode in="SourceGraphic"/>

                    </filter>

                    <filter id="glow-orb-red" x="-150%" y="-150%" width="400%" height="400%">

                    <!-- Hacim Gölgeleri -->

                    </g>

                    <!-- Kollar (Ön Katman - Çene ve Gövdenin Önünde) -->

        <!-- 12 Duygu Durumu Seçici -->
        <div id="controls-panel">
            <button class="btn-emotion active" data-target="normal">✨ Normal</button>

            <button class="btn-emotion" data-target="dusunuyor">🧠 Düşünüyor</button>
            <button class="btn-emotion" data-target="taktik">💡 Taktik / Buldum</button>
            <button class="btn-emotion" data-target="mutlu">😊 Mutlu</button>
            <button class="btn-emotion" data-target="heyecanli">🎉 Heyecanlı</button>
            <button class="btn-emotion" data-target="merakli">🤔 Meraklı</button>
            <button class="btn-emotion" data-target="saskin">😲 Şaşkın</button>
            <button class="btn-emotion" data-target="mahcup">😳 Mahcup</button>
            <button class="btn-emotion" data-target="teselli">😔 Teselli</button>
            <button class="btn-emotion" data-target="uyari">🛡️ Koruma / Uyarı</button>
            <button class="btn-emotion" data-target="uykulu">💤 Uykulu</button>
            <button class="btn-emotion" data-target="tirmaniyor">🧗 Tırmanıyor</button>
            <button class="btn-emotion" data-target="asili">🌟 Tavanda Asılı</button>
            <button class="btn-emotion" data-target="hover_drop">💨 Çizgi Film Düşüşü</button>
        </div>
    </div>

    <script>
        const dialogs = {
            "normal": "Merhaba! Ben Lumi, senin kişisel çalışma arkadaşınım! ✨",
            "dinliyor": "Seni pür dikkat dinliyorum, kafandaki soruyu yaz gelsin! 👂",
            "dusunuyor": "Hmm... Nöral loblarımı çalıştırıyorum, en iyi yöntemi tarıyorum... 🧠",
            "taktik": "Aha! İşte tam senin profiline göre altın değerinde bir çalışma taktiği! 💡",
            "mutlu": "Harika gidiyorsun! Seninle çalışmak gerçekten çok keyifli 💙",
            "heyecanli": "Vay canına! İnanılmaz bir odaklanma puanı! Böyle devam! 🎉🚀",
            "merakli": "Hmm... Bu öğrenme stili nasıl bir sonuç verecek acaba? İnceleyelim mi? 🤔",
            "saskin": "Vay canına! Bunu hiç beklemiyordum, çok ilginç bir teknik! 😲",
            "mahcup": "Şey... güzel sözlerin için teşekkürler, beni biraz utandırdın 😳💖",
            "teselli": "Bazen odaklanmak zor olabilir, hiç canını sıkma. 5 dakika mola verip baştan deneyelim 🤝",
            "uyari": "Hop! Kişisel verilerini korumam ve kurallara uymam gerekiyor, bunu yapamam 🛡️🔒",
            "uykulu": "Bugün çok verimli çalıştık ama göz kapaklarım ağırlaşıyor... ZzZz 💤",
            "tirmaniyor": "Tuttum duvarı, yukarı doğru tırmanıyorum! Kollarıma ve bacaklarıma bak! 🧗✨",
            "asili": "Tavandayım! Burası çok havalı, biraz sallanıp aşağı atlayacağım! 🌟🪂",
            "hover_drop": "Aaa zemin nereye gitti?! Ayaklarım boşlukta pedal çeviriyor, düşüyoruum! 😱🕳️"
        };

        const stage = document.getElementById('lumi-stage');
        const speechBubble = document.getElementById('speech-text');
        const buttons = document.querySelectorAll('.btn-emotion');

        function setLumiState(newState) {
            if (!dialogs[newState]) return;
            buttons.forEach(b => b.classList.toggle('active', b.dataset.target === newState));
            stage.setAttribute('data-state', newState);
            updateSpeechBubble(dialogs[newState]);
        }

        buttons.forEach(btn => {
            btn.addEventListener('click', () => setLumiState(btn.dataset.target));
        });

        function updateSpeechBubble(text) {
            speechBubble.style.animation = 'none';
            speechBubble.offsetHeight;
            speechBubble.innerText = text;
            speechBubble.style.animation = 'bubbleUpdate 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards';
        }

        // Test kolaylığı: URL param desteği (?state=dusunuyor)
        const param = new URLSearchParams(location.search).get('state');
        if (param && dialogs[param]) setLumiState(param);
    </script>
</body>
</html>
